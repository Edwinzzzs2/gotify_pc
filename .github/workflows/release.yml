name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Normalize lockfile registry
        run: |
          if (Test-Path "package-lock.json") {
            $content = Get-Content -Path "package-lock.json" -Raw
            $content = $content -replace 'https://packages\.aliyun\.com/5f9a23913a5188f27f3f344b/npm/npm-registry/', 'https://registry.npmjs.org/'
            Set-Content -Path "package-lock.json" -Value $content -Encoding utf8
          }
        shell: powershell

      - name: Install dependencies
        run: npm install

      - name: Update package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          npm version $version --no-git-tag-version
        shell: powershell

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/**/*.exe
            dist/**/*.blockmap
            dist/**/*.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
